{% extends "base.html" %}
{% block title %}Register Operator | Traffic Sign AI Assistant{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="glass-card auth-card shadow-2xl">
    <div class="text-center mb-4">
      <div class="stat-icon-wrapper stat-icon-cyan mx-auto mb-3" style="width: 54px; height: 54px;">
        <i class="fa-solid fa-user-plus fs-3"></i>
      </div>
      <h3 class="brand-font text-white mb-1">Create Operator Account</h3>
      <p class="text-secondary fs-8 mb-0">Join the Road Safety Assistant Platform</p>
      <span class="badge badge-cyber badge-info mt-2">PSN Engineering College &bull; Dept of CSE</span>
    </div>

    <form method="POST" action="{{ url_for('register') }}">
      <div class="mb-3">
        <label class="form-label-cyber">Operator Username</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-user"></i></span>
          <input type="text" name="username" class="form-cyber-input" placeholder="Choose a unique username..." required autofocus>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label-cyber">Security Password</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-lock"></i></span>
          <input type="password" name="password" class="form-cyber-input" placeholder="Create a strong password..." required>
        </div>
      </div>

      <button type="submit" class="btn btn-cyber-primary w-100 py-2 mb-3">
        <i class="fa-solid fa-circle-check"></i> Complete Registration
      </button>

      <div class="text-center text-secondary fs-8">
        Already have an account? <a href="{{ url_for('login') }}" class="text-cyan text-decoration-none fw-semibold">Sign In Here</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
